<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeTaco</title><style>body{margin:0;background:#191426;color:#ffe6a3;font-family:system-ui;text-align:center}a{color:#ffe6a3}canvas{display:block;width:min(96vw,440px);height:auto;margin:auto;background:#322445;border:4px solid #e7ae39;touch-action:none;image-rendering:pixelated}button{margin:15px;padding:13px 30px;border:0;border-radius:9px;background:#e7ae39;font-weight:bold;font-size:18px}header{padding:15px}#stats{margin:12px}</style></head><body><header><a href="./index.html">← LeFantasy Arcade</a><h1>🌮 LETACO</h1><p>Move the King's pixel head to catch tacos. Catch tacos, avoid broccoli! Three mistakes and you're out!</p></header><div id="stats">Score: 0 | Misses: 0/3 | Best: 0</div><canvas id="game" width="360" height="520"></canvas><button id="play">START</button><p>Drag on mobile · Arrow keys or A/D on desktop</p><script>
const c=document.getElementById('game'),g=c.getContext('2d'),stats=document.getElementById('stats'),play=document.getElementById('play');g.imageSmoothingEnabled=false;
let x=180,items=[],score=0,miss=0,best=0,running=false,spawn=0,last=0,keys={},runId=0;try{best=Number(localStorage.getItem('letaco-best'))||0}catch{}
function block(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
const kingSprite=new Image();let spriteReady=false;kingSprite.onload=()=>{spriteReady=true;draw()};kingSprite.src='./letaco-king.svg?v=3';
function king(){if(spriteReady){g.drawImage(kingSprite,Math.round(x-48),Math.round(430-56),96,112)}else{block(x-34,390,68,75,'#21171c');block(x-27,398,54,58,'#b7764b');block(x-20,420,12,8,'#fff');block(x+8,420,12,8,'#fff');block(x-16,442,32,14,'#28181b')}}
function broccoli(t){const xx=t.x,yy=t.y;block(xx-4,yy+2,8,18,'#8dbd59');block(xx-13,yy-7,26,15,'#25783d');block(xx-17,yy-3,12,12,'#328a44');block(xx+5,yy-9,13,16,'#328a44');block(xx-8,yy-12,15,8,'#45a44c');block(xx-10,yy-4,5,5,'#61b757')}
function taco(t){block(t.x-15,t.y,30,11,'#efb64b');block(t.x-12,t.y-5,24,6,'#f9d572');block(t.x-11,t.y-2,22,3,'#58aa54');block(t.x-10,t.y+4,20,3,'#bb5636')}
function draw(){block(0,0,360,520,'#322445');for(let i=0;i<10;i++)block(i*40,55+(i%3)*30,4,4,'#534065');block(0,476,360,44,'#68418c');block(0,473,360,3,'#f4c452');for(const t of items){if(t.bad)broccoli(t);else taco(t)}king();if(!running){block(40,190,280,95,'#20182f');g.fillStyle='#ffe6a3';g.textAlign='center';g.font='bold 22px system-ui';g.fillText(miss>=3?'GAME OVER':'READY, KING?',180,225);g.font='16px system-ui';g.fillText(miss>=3?'You caught '+score+' tacos':'Tap START to play',180,255)}}
function hud(){stats.textContent='Score: '+score+' | Misses: '+miss+'/3 | Best: '+best}
function start(){runId++;score=0;miss=0;items=[];spawn=0;running=true;last=performance.now();play.textContent='RESTART';hud();requestAnimationFrame(now=>tick(now,runId))}
function tick(now,id){if(!running||id!==runId)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(keys.ArrowLeft||keys.a)x-=260*dt;if(keys.ArrowRight||keys.d)x+=260*dt;x=Math.max(50,Math.min(310,x));spawn+=dt;if(spawn>Math.max(.35,1.15-score*.018)){spawn=0;items.push({x:25+Math.random()*310,y:-15,bad:Math.random()<.23})}for(const t of items){t.y+=(145+Math.min(230,score*5))*dt;if(t.y>389&&t.y<454&&Math.abs(t.x-x)<42){t.done=true;if(t.bad){miss++}else{score++;if(score>best){best=score;try{localStorage.setItem('letaco-best',String(best))}catch{}}}}else if(t.y>490){t.done=true;if(!t.bad)miss++}}items=items.filter(t=>!t.done);if(miss>=3){running=false;play.textContent='PLAY AGAIN'}hud();draw();if(running)requestAnimationFrame(now=>tick(now,id))}
function move(e){const r=c.getBoundingClientRect();x=Math.max(50,Math.min(310,(e.clientX-r.left)*360/r.width));draw()}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!running)start()});window.addEventListener('keyup',e=>keys[e.key]=false);play.onclick=start;hud();draw();
</script></body></html>
